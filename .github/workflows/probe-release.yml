name: Probe release notes

on:
  workflow_dispatch:
    inputs:
      preparation_run_id:
        description: Failed Prepare release run ID containing the review artifact
        type: string
        required: true
      selection:
        description: Evidence batch number (starting at 1), or final to test the notes
        type: string
        required: true

permissions:
  actions: read
  contents: read

jobs:
  probe:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Load failed preparation evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-review
          run-id: ${{ inputs.preparation_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-previous
      - name: Install pinned Copilot CLI
        run: npm install --prefix .github/automation/copilot --no-audit --no-fund
      - name: Test selected release-analysis stage
        run: |
          export PATH="$GITHUB_WORKSPACE/.github/automation/copilot/node_modules/.bin:$PATH"
          python3 .github/automation/release_probe.py
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_MODEL: ${{ vars.RELEASE_COPILOT_MODEL }}
          RELEASE_RESUME_DIR: ${{ runner.temp }}/release-previous
          RELEASE_PROBE_BATCH: ${{ inputs.selection }}
          RELEASE_MAX_AI_CALLS: ${{ vars.RELEASE_MAX_AI_CALLS || '20' }}
      - name: Save final probe results
        if: always() && inputs.selection == 'final'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-final-probe
          path: |
            ${{ runner.temp }}/release-previous/final-candidate.json
            ${{ runner.temp }}/release-previous/notes.md
            ${{ runner.temp }}/release-previous/review.md
          retention-days: 7
          if-no-files-found: ignore
