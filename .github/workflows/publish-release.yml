name: Publish release

on:
  push:
    branches: [master]
    paths: ['.github/release-state.json']
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact release merge commit to retry
        required: true

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed release and publish
        run: python3 .github/automation/release_publish.py
        env:
          GH_TOKEN: ${{ github.token }}

  sync:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
      - name: Open synchronization PR into develop
        run: python3 .github/automation/release_publish.py sync
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
