name: Configuration checks

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

permissions:
  contents: read

concurrency:
  group: configuration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck zsh
          python3 -m pip install PyYAML==6.0.3
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate changed configurations
        run: python3 .github/automation/config_checks.py
        env:
          CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHECK_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate workflows
        run: '"$(go env GOPATH)/bin/actionlint"'
      - name: Test automation helpers
        run: python3 -m unittest discover -s .github/automation/tests -v
      - name: Validate release-only PR
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/')
        run: python3 .github/automation/release_check.py
        env:
          RELEASE_HEAD: ${{ github.event.pull_request.head.sha }}
          RELEASE_BASE: ${{ github.event.pull_request.base.sha }}
