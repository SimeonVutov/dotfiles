name: Prepare release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-preparation
  cancel-in-progress: false

jobs:
  analyze:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Collect release evidence
        run: python3 .github/automation/release_collect.py
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BUMP: ${{ inputs.bump }}
          RELEASE_DIR: ${{ runner.temp }}/release
      - name: Install pinned Copilot CLI
        run: npm install --prefix .github/automation/copilot --no-audit --no-fund
      - name: Analyze and reconcile changes
        run: |
          export PATH="$GITHUB_WORKSPACE/.github/automation/copilot/node_modules/.bin:$PATH"
          python3 .github/automation/release_analyze.py
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_MODEL: ${{ vars.RELEASE_COPILOT_MODEL }}
          RELEASE_MAX_AI_CALLS: ${{ vars.RELEASE_MAX_AI_CALLS || '100' }}
          RELEASE_DIR: ${{ runner.temp }}/release
      - name: Save evidence and reviewed-note candidates
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-review
          path: ${{ runner.temp }}/release
          retention-days: 30
          if-no-files-found: ignore

  propose:
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PR_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-review
          path: ${{ runner.temp }}/release
      - name: Create metadata-only release PR
        run: python3 .github/automation/release_propose.py
        env:
          RELEASE_DIR: ${{ runner.temp }}/release
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
