name: Prepare release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-preparation
  cancel-in-progress: false

jobs:
  analyze:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RELEASE_DIR: ${{ runner.temp }}/release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Collect release evidence
        run: python3 .github/automation/release_collect.py
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BUMP: ${{ inputs.bump }}
      - name: Install pinned Copilot CLI
        run: npm install --prefix .github/automation/copilot --no-audit --no-fund
      - name: Analyze and reconcile changes
        run: |
          export PATH="$GITHUB_WORKSPACE/.github/automation/copilot/node_modules/.bin:$PATH"
          python3 .github/automation/release_analyze.py
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_MODEL: ${{ vars.RELEASE_COPILOT_MODEL }}
          RELEASE_MAX_AI_CALLS: ${{ vars.RELEASE_MAX_AI_CALLS || '100' }}
      - name: Save evidence and reviewed-note candidates
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-review
          path: ${{ runner.temp }}/release
          retention-days: 30
          if-no-files-found: ignore

  propose:
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_DIR: ${{ runner.temp }}/release
      GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PR_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-review
          path: ${{ runner.temp }}/release
      - name: Create metadata-only release PR
        run: python3 .github/automation/release_propose.py
